<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
const sg=(x,d=2)=>x==null||!isFinite(x)?'–':(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(d);
const fx=(x,d=2)=>x==null||!isFinite(x)?'–':x.toFixed(d);
const todayStr=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const dow=s=>new Date(s+'T00:00:00Z').getUTCDay();
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(new Date(s+'T00:00:00Z'));

/* ---------- static definitions ---------- */
const IND=[
 {id:'cpi_core',n:'CPI inti (m/m)',c:'I',s:1,u:'%',sd:0.10},
 {id:'cpi',n:'CPI headline (m/m)',c:'I',s:1,u:'%',sd:0.12},
 {id:'pce_core',n:'PCE inti (m/m)',c:'I',s:1,u:'%',sd:0.08},
 {id:'ppi',n:'PPI (m/m)',c:'I',s:1,u:'%',sd:0.25},
 {id:'ahe',n:'Upah per jam (m/m)',c:'I',s:1,u:'%',sd:0.12},
 {id:'nfp',n:'NFP',c:'G',s:1,u:'ribu',sd:75},
 {id:'unemp',n:'Tingkat pengangguran',c:'G',s:-1,u:'%',sd:0.12},
 {id:'claims',n:'Klaim awal pengangguran',c:'G',s:-1,u:'ribu',sd:15},
 {id:'jolts',n:'JOLTS lowongan',c:'G',s:1,u:'juta',sd:0.35},
 {id:'ism_m',n:'ISM manufaktur',c:'G',s:1,u:'poin',sd:1.5},
 {id:'ism_s',n:'ISM jasa',c:'G',s:1,u:'poin',sd:1.8},
 {id:'retail',n:'Penjualan ritel (m/m)',c:'G',s:1,u:'%',sd:0.5},
 {id:'ip',n:'Produksi industri (m/m)',c:'G',s:1,u:'%',sd:0.3},
 {id:'empire',n:'Empire State (NY Fed)',c:'G',s:1,u:'poin',sd:8},
 {id:'philly',n:'Philly Fed',c:'G',s:1,u:'poin',sd:9},
 {id:'gdp',n:'GDP (q/q anualisasi)',c:'G',s:1,u:'%',sd:0.7},
 {id:'cn_pmi',n:'PMI manufaktur China',c:'G',s:1,u:'poin',sd:0.7},
 {id:'eu_pmi',n:'PMI komposit Eropa',c:'G',s:1,u:'poin',sd:1.2}];
const IND_BY=Object.fromEntries(IND.map(d=>[d.id,d]));
const CBS=[['FED','Federal Reserve'],['ECB','ECB'],['BOE','Bank of England'],['BOJ','Bank of Japan'],['RBA','RBA'],['BI','Bank Indonesia']];
const COTS=[['GOLD','Emas'],['CRUDE','Minyak WTI'],['COPPER','Tembaga'],['EUR','EUR'],['GBP','GBP'],['JPY','JPY'],['AUD','AUD'],['SPX','S&P 500 E-mini'],['NDX','Nasdaq 100 E-mini'],['BTC','Bitcoin CME']];
const ASSETS=[
 {k:'XAU',n:'XAUUSD (emas)',cot:'GOLD'},{k:'WTI',n:'WTI minyak',cot:'CRUDE'},{k:'CU',n:'Tembaga',cot:'COPPER'},
 {k:'SPX',n:'S&P 500',cot:'SPX'},{k:'NDX',n:'Nasdaq 100',cot:'NDX'},{k:'BTC',n:'Bitcoin',cot:'BTC'},
 {k:'EEM',n:'EEM (emerging)'},{k:'IHSG',n:'IHSG'},
 {k:'EURUSD',n:'EURUSD',cot:'EUR'},{k:'GBPUSD',n:'GBPUSD',cot:'GBP'},{k:'USDJPY',n:'USDJPY',cot:'JPY',inv:true},
 {k:'AUDUSD',n:'AUDUSD',cot:'AUD'},{k:'USDIDR',n:'USDIDR'},{k:'US02Y',n:'Yield US 2Y'},
 {k:'DXY',n:'DXY (hub USD)',hub:'usd'},{k:'RY',n:'Real yield 10Y (hub)',hub:'ry'}];
const FACT=['G','I','P','L','R','RY','USD'];
const BETA={ /* g,i,p,l,r,ry,usd — prior ekonomi awal, bukan hasil estimasi */
 XAU:[0,.3,0,.3,.4,-.7,-.5],WTI:[.5,.4,0,.1,-.4,0,-.3],CU:[.7,0,0,.2,-.5,0,-.4],
 SPX:[.4,-.1,-.1,.4,-.7,-.4,-.2],NDX:[.3,-.1,-.1,.5,-.8,-.6,-.2],BTC:[.1,0,0,.7,-.7,-.4,-.4],
 EEM:[.3,0,0,.4,-.6,-.3,-.5],IHSG:[.3,0,0,.3,-.6,-.3,-.4],
 EURUSD:[0,0,0,0,-.2,0,-.9],GBPUSD:[.1,0,0,0,-.3,0,-.8],USDJPY:[.1,0,0,0,-.5,.6,.4],
 AUDUSD:[.4,0,0,0,-.5,-.1,-.6],USDIDR:[-.1,0,0,-.2,.6,.2,.7],US02Y:[.3,.3,.9,0,-.4,.3,0]};
const QUAD={GOLD:'Goldilocks (growth naik, inflasi turun)',OVER:'Reflasi / overheating (growth naik, inflasi naik)',STAG:'Stagflasi (growth turun, inflasi naik)',SLOW:'Perlambatan / deflasi (growth turun, inflasi turun)'};
const PH={ /* tabel override saat mode krisis, skor dalam satuan sigma */
 1:{XAU:-.5,WTI:-1.5,CU:-1.5,SPX:-2,NDX:-2,BTC:-2,EEM:-2,IHSG:-2,EURUSD:-1,GBPUSD:-1.2,USDJPY:-1.2,AUDUSD:-1.5,USDIDR:1.5,US02Y:-1,DXY:1.8,RY:-.5},
 2:{XAU:1.2,WTI:.3,CU:.3,SPX:.8,NDX:1,BTC:1,EEM:.7,IHSG:.5,EURUSD:.8,GBPUSD:.8,USDJPY:-.3,AUDUSD:.6,USDIDR:-.5,US02Y:-1.5,DXY:-1.2,RY:-1.2},
 3:{XAU:1,WTI:1.2,CU:1.5,SPX:1.5,NDX:1.8,BTC:1.8,EEM:1.4,IHSG:1.2,EURUSD:.6,GBPUSD:.6,USDJPY:.6,AUDUSD:1.2,USDIDR:-.8,US02Y:.6,DXY:-.6,RY:.4}};
const PHN={1:'Fase 1: panik, cash is king',2:'Fase 2: respons bank sentral',3:'Fase 3: pemulihan / reflasi'};
const SCEN={
 none:{n:'Tidak ada',t:'',v:{}},
 energi:{n:'Perang / gangguan pasokan energi',t:'Modal ke energi, USD, emas. Keluar dari importir energi dan saham Eropa.',v:{WTI:1.5,XAU:.5,DXY:.5,EURUSD:-.6,SPX:-.5,NDX:-.4,EEM:-.4,USDIDR:.4,CU:-.2}},
 bank:{n:'Krisis perbankan',t:'Deposito ke bank besar dan money market, yield pendek jatuh, emas naik.',v:{US02Y:-1.5,XAU:1,SPX:-.5,NDX:.3,DXY:-.2,RY:-.7}},
 tarif:{n:'Perang tarif / dagang',t:'Pola safe haven klasik rusak: USD melemah, emas melonjak, term premium naik.',v:{DXY:-.8,XAU:1.2,SPX:-1,NDX:-1,CU:-.8,EEM:-.8,AUDUSD:-.6,USDIDR:.5,RY:.3}},
 carry:{n:'Carry unwind / intervensi JPY',t:'JPY menguat tajam, ekuitas global dan kripto turun, VIX melonjak singkat.',v:{USDJPY:-2,SPX:-1,NDX:-1,BTC:-1.2,AUDUSD:-1,XAU:.3,EEM:-.6}},
 mideast:{n:'Geopolitik Timur Tengah',t:'Minyak, emas, USD naik. Bedakan gangguan fisik (tahan lama) dari headline (cepat memudar).',v:{WTI:1.2,XAU:.8,DXY:.4,SPX:-.4,EEM:-.3,USDIDR:.3}},
 pandemi:{n:'Pandemi / shock permintaan',t:'Ekuitas ke cash dan Treasury, minyak dan tembaga anjlok akibat demand shock.',v:{WTI:-1.2,CU:-1,SPX:-1,NDX:-.5,XAU:.3,DXY:.5,US02Y:-1}}};

/* ---------- state ---------- */
const defModel=()=>{const beta={};for(const k in BETA)beta[k]=BETA[k].slice();
 return{beta,hub:{ry:{P:.6,G:.3,I:.1,R:-.3,L:-.1},usd:{Pd:.4,RY:.3,R:.2,L:-.15,G:.1}},
 mult:{GOLD:{ry:.6,usd:1},OVER:{ry:1.3,usd:1},STAG:{ry:1.5,usd:1},SLOW:{ry:.6,usd:1.1}}}};
const defaults=()=>({v:1,asof:todayStr(),example:false,set:{hl:30,win:90,k:1},sigma:{},releases:[],cb:{},cot:{},
 shock:{vix:null,vix3m:null,move:null,hy:null,hyp:null,scn:'none',int:1,ph:1},
 liq:{w0:null,t0:null,r0:null,w1:null,t1:null,r1:null},model:defModel()});
function norm(s){const d=defaults();const o=Object.assign(d,s||{});
 const f=defaults();o.set=Object.assign(f.set,(s&&s.set)||{});o.shock=Object.assign(f.shock,(s&&s.shock)||{});o.liq=Object.assign(f.liq,(s&&s.liq)||{});
 const m=defModel(),sm=(s&&s.model)||{};for(const k in m.beta)if(sm.beta&&Array.isArray(sm.beta[k])&&sm.beta[k].length===7)m.beta[k]=sm.beta[k];
 for(const g of['ry','usd'])Object.assign(m.hub[g],(sm.hub&&sm.hub[g])||{});for(const q in m.mult)Object.assign(m.mult[q],(sm.mult&&sm.mult[q])||{});
 o.model=m;o.sigma=o.sigma||{};o.releases=Array.isArray(o.releases)?o.releases:[];o.cb=o.cb||{};o.cot=o.cot||{};
 for(const[k]of CBS)o.cb[k]=Object.assign({rate:null,imp:null,infl:null,txt:0,dec:0},o.cb[k]||{});
 for(const[k]of COTS){o.cot[k]=Object.assign({rows:[],min:null,max:null},o.cot[k]||{});if(!Array.isArray(o.cot[k].rows))o.cot[k].rows=[]}
 o.asof=todayStr();return o}
function makeExample(){const s=norm({});const t=s.asof;let id=1;
 const R=(ago,ind,act,cons)=>s.releases.push({id:'x'+id++,date:addDays(t,-ago),ind,act,cons,prev:null,note:'contoh'});
 R(3,'ism_s',51.5,51);R(5,'claims',232,225);R(9,'pce_core',.2,.2);R(18,'cpi_core',.3,.25);R(20,'retail',.4,.3);
 R(29,'nfp',142,160);R(29,'unemp',4.4,4.3);R(29,'ahe',.4,.3);R(31,'ism_m',49.2,49.8);R(35,'gdp',3,2.8);
 s.cb.FED={rate:4.0,imp:3.6,infl:2.9,txt:1,dec:0};s.cb.ECB={rate:2.0,imp:1.8,infl:2.3,txt:0,dec:0};s.cb.BOJ={rate:.5,imp:.9,infl:2.5,txt:1,dec:1};s.cb.BI={rate:4.75,imp:4.5,infl:2.1,txt:-1,dec:0};
 let tu=t;while(dow(tu)!==2||addDays(tu,3)>t)tu=addDays(tu,-1);
 for(let i=0;i<14;i++){const d=addDays(tu,-7*(13-i));
  s.cot.GOLD.rows.push({d,net:Math.round(170000+i*5200+Math.sin(i)*12000),oi:520000});
  s.cot.JPY.rows.push({d,net:Math.round(-40000+i*-3500+Math.cos(i)*9000),oi:260000})}
 Object.assign(s.shock,{vix:19.5,vix3m:21.8,move:98,hy:3.4,hyp:3.3});
 Object.assign(s.liq,{w0:6600,t0:850,r0:120,w1:6580,t1:820,r1:140});
 s.example=true;return s}

let state,dbDoc=null,saveT=null,saving=false;
const ui={tab:'dash',open:null,msg:''};
let draft={rel:{date:todayStr(),ind:'cpi_core',act:null,cons:null},cotKey:'GOLD',cot:{d:'',net:null,oi:null},csvRel:'',csvCot:'',imp:''};
function lastTue(a){let d=a;while(dow(d)!==2||addDays(d,3)>a)d=addDays(d,-1);return d}

/* ---------- model ---------- */
const META={audit:null,est:{}};
const FS={feed:'memuat',audit:'memuat',beta:'memuat',gen:{}};
let AUD_HTML='';
function leaveExample(){if(state.example){state=norm({});state.example=false}}
const betaOf=(st,k)=>{const b=st.model.beta[k],pr=BETA[k];const same=pr&&b&&b.length===pr.length&&b.every((v,i)=>v===pr[i]);return(same&&META.est[k])?META.est[k]:b};
function sigmaFor(st,id){const ov=st.sigma[id];if(ov!=null&&ov>0)return{v:ov,src:'manual'};
 const xs=st.releases.filter(r=>r.ind===id&&r.cons!=null&&r.act!=null).map(r=>r.act-r.cons);
 if(xs.length>=8){const m=xs.reduce((a,b)=>a+b,0)/xs.length;const v=Math.sqrt(xs.reduce((a,b)=>a+(b-m)**2,0)/(xs.length-1));if(v>0)return{v,src:'empiris n='+xs.length}}
 return{v:IND_BY[id].sd,src:'awal'}}
function indices(st){const acc={G:{n:0,d:0,c:0},I:{n:0,d:0,c:0}};const rows=[];
 for(const r of st.releases){const d=IND_BY[r.ind];if(!d)continue;const age=diffDays(st.asof,r.date);const s=sigmaFor(st,r.ind);
  const z=(r.cons==null||r.act==null)?null:d.s*(r.act-r.cons)/s.v;const inW=age>=0&&age<=st.set.win;const w=inW?Math.pow(.5,age/st.set.hl):0;
  rows.push({...r,z,age,w,cat:d.c,sig:s});
  if(z!=null&&inW){const o=acc[d.c];o.n+=w*clamp(z,-3,3);o.d+=w;o.c++}}
 const f=o=>clamp(o.n/(o.d+st.set.k),-3,3);
 const sG=f(acc.G),sI=f(acc.I),ac=st.actual,useA=st.set.gi!=='surprise'&&ac&&ac.G&&ac.I&&ac.G.v!=null&&ac.I.v!=null&&ac.G.n>=3&&ac.I.n>=3;
 return useA?{G:ac.G.v,I:ac.I.v,nG:ac.G.n,nI:ac.I.n,src:'aktual',sG,sI,rows,ac}:{G:sG,I:sI,nG:acc.G.c,nI:acc.I.c,src:'surprise',sG,sI,rows,ac}}
function cbStance(c){const em=(c.rate!=null&&c.imp!=null)?clamp((c.imp-c.rate)/.25,-4,4):0;
 const has=(c.rate!=null&&c.imp!=null)||!!c.txt||!!c.dec;
 return{st:clamp(.35*em+.35*(c.txt||0)+.3*(c.dec||0),-3,3),em,has,real:(c.rate!=null&&c.infl!=null)?c.rate-c.infl:null}}
function shockCalc(s){const ratio=(s.vix!=null&&s.vix3m)?s.vix/s.vix3m:null;const hyd=(s.hy!=null&&s.hyp!=null)?s.hy-s.hyp:null;
 const t=[{k:'VIX di atas 30',on:s.vix!=null&&s.vix>30,v:s.vix!=null?fx(s.vix,1):'–'},
  {k:'VIX / VIX3M di atas 1 (inverted)',on:ratio!=null&&ratio>1,v:ratio!=null?fx(ratio,2):'–'},
  {k:'MOVE di atas 130',on:s.move!=null&&s.move>130,v:s.move!=null?fx(s.move,0):'–'},
  {k:'HY OAS naik lebih dari 1,0 poin (20 hari)',on:hyd!=null&&hyd>1,v:hyd!=null?sg(hyd,2):'–'}];
 const n=t.filter(x=>x.on).length;const cs=[];
 if(s.vix!=null)cs.push((s.vix-18)/10);if(ratio!=null)cs.push((ratio-.9)/.15);if(s.move!=null)cs.push((s.move-90)/40);if(hyd!=null)cs.push(hyd/.5);
 const R=cs.length?clamp(cs.map(c=>clamp(c,-.5,3)).reduce((a,b)=>a+b,0)/cs.length,0,3):0;
 return{t,n,mode:n>=2?'KRISIS':n===1?'WASPADA':'NORMAL',R,ratio,hyd,have:cs.length}}
function liqCalc(l){const ok=['w0','t0','r0','w1','t1','r1'].every(k=>l[k]!=null);
 if(!ok)return{ok:false,L:0,now:null,prev:null,d:null};const now=l.w0-l.t0-l.r0,prev=l.w1-l.t1-l.r1;
 return{ok:true,now,prev,d:now-prev,L:clamp((now-prev)/150,-2,2)}}
function cotCalc(st,key){const c=st.cot[key];if(!c)return{n:0};
 const rows=c.rows.filter(r=>r.oi>0&&validDate(r.d)&&addDays(r.d,3)<=st.asof).sort((a,b)=>a.d<b.d?-1:1);
 const ser=rows.map(r=>r.net/r.oi*100);if(!ser.length)return{n:0};const last=ser[ser.length-1];let pct=null,src='';
 if(c.min!=null&&c.max!=null&&c.max>c.min){pct=clamp((last-c.min)/(c.max-c.min),0,1);src='rentang manual'}
 else if(ser.length>=10){pct=ser.filter(x=>x<=last).length/ser.length;src='peringkat riwayat, n='+ser.length}
 return{n:ser.length,last,pct,src,ser,pos:rows[rows.length-1].d,rel:addDays(rows[rows.length-1].d,3)}}
function run(st){
 const ix=indices(st),G=ix.G,I=ix.I;
 const cbs={};for(const[k]of CBS)cbs[k]=cbStance(st.cb[k]);
 const P=cbs.FED.st;const oth=CBS.slice(1).map(([k])=>cbs[k]).filter(c=>c.has);
 const Pd=P-(oth.length?oth.reduce((a,c)=>a+c.st,0)/oth.length:0);
 const sh=shockCalc(st.shock),lq=liqCalc(st.liq),R=sh.R,L=lq.L;
 const q=G>=0?(I>=0?'OVER':'GOLD'):(I>=0?'STAG':'SLOW');const m=st.model.mult[q],h=st.model.hub;
 const RY=h.ry.P*P+h.ry.G*G+h.ry.I*I+h.ry.R*R+h.ry.L*L;
 const USD=h.usd.Pd*Pd+h.usd.RY*RY+h.usd.R*R+h.usd.L*L+h.usd.G*G;
 const crisis=sh.mode==='KRISIS',scn=SCEN[st.shock.scn]||SCEN.none,inten=st.shock.int==null?1:st.shock.int;
 const cov=clamp((ix.nG+ix.nI)/8,0,1);
 const out=ASSETS.map(a=>{let parts={},score;
  if(crisis){const v=PH[st.shock.ph||1][a.k]||0;parts={'Tabel krisis':v}}
  else if(a.hub==='ry'){parts={'Fed (P)':h.ry.P*P,'Growth (G)':h.ry.G*G,'Inflasi (I)':h.ry.I*I,'Stres (R)':h.ry.R*R,'Likuiditas (L)':h.ry.L*L};for(const k in parts)parts[k]*=m.ry}
  else if(a.hub==='usd'){parts={'Selisih Fed':h.usd.Pd*Pd,'Real yield':h.usd.RY*RY,'Stres (R)':h.usd.R*R,'Likuiditas (L)':h.usd.L*L,'Growth (G)':h.usd.G*G};for(const k in parts)parts[k]*=m.usd}
  else{const b=betaOf(st,a.k);parts={'Growth (G)':b[0]*G,'Inflasi (I)':b[1]*I,'Fed (P)':b[2]*P,'Likuiditas (L)':b[3]*L,'Stres (R)':b[4]*R,'Real yield':b[5]*RY*m.ry,'USD':b[6]*USD*m.usd}}
  const sv=(scn.v[a.k]||0)*inten;if(sv)parts['Skenario']=sv;
  score=Object.values(parts).reduce((x,y)=>x+y,0);
  let cot=null,cr=null,flag='';if(a.cot){cot=cotCalc(st,a.cot);if(cot.pct!=null){cr=(cot.pct-.5)*2*(a.inv?-1:1);
    if(Math.abs(cr)>.8){const same=Math.sign(cr)===Math.sign(score)&&Math.abs(score)>=.4;flag=same?'ramai searah':'ramai berlawanan'}}}
  let conv=crisis?.5:cov*(cbs.FED.has?1:.75);if(flag==='ramai searah')conv*=.7;
  return{...a,score,parts,cot,cr,flag,conv}});
 return{ix,cbs,P,Pd,sh,lq,L,R,q,RY,USD,crisis,out,scn,inten}}
function lab(v){return v>=1?['Naik kuat','p']:v>=.4?['Naik','p']:v<=-1?['Turun kuat','n']:v<=-.4?['Turun','n']:['Netral','z']}
const bar=(v,max=3)=>{const w=clamp(Math.abs(v)/max,0,1)*50,p=v>=0;return `<span class="bar"><i class="${p?'p':'n'}" style="${p?'left':'right'}:50%;width:${w}%"></i></span>`};

const SIG={th:.75,cv:.6,scn:.6,weak:.4,cons:.6};
function consShare(){const w=state.set.win;const rs=state.releases.filter(x=>x.cons!=null&&x.act!=null&&diffDays(state.asof,x.date)>=0&&diffDays(state.asof,x.date)<=w);

function sigGates(){const g=[],cs=consShare(),au=META.audit;
 if(state.example)g.push('masih memakai data contoh');
 if(!au)g.push('audit data belum tersedia ('+FS.audit+')');else if(au.fail>0)g.push(`audit data: ${au.fail} pemeriksaan GAGAL`);
 if(indices(state).src==='surprise'&&cs.share<SIG.cons)g.push(`konsensus pasar asli baru ${cs.real} dari ${cs.n} rilis dalam ${state.set.win} hari (butuh ≥${Math.round(SIG.cons*100)}%)`);
 return g}
function signalFor(a,r,gates){if(a.hub)return null;
 const s=a.score,abs=Math.abs(s),dir=s>0?'BUY':'SELL',why=[];let conv=a.conv;
 if(abs<SIG.weak)return{act:'HOLD',lean:'',why:[`skor ${sg(s)} lemah (di bawah ${SIG.weak})`]};
 if(META.est[a.k]==null){const bi=META.betaInfo&&META.betaInfo.assets&&META.betaInfo.assets[a.k];
  if(!bi||bi.r2_prior==null){conv*=.85;why.push('beta masih prior dan belum pernah diuji')}
  else if(bi.r2_prior<=.01)why.push('beta prior tidak punya daya prediksi pada uji walk-forward')}
 if(abs<SIG.th)why.push(`skor ${sg(s)} di bawah ambang ${SIG.th}`);

 const sc=(a.parts['Skenario']||0)*Math.sign(s);if(sc/abs>SIG.scn)why.push(`${Math.round(sc/abs*100)}% skor berasal dari skenario manual, bukan data`);
 if(r.crisis)why.push('mode krisis: skor dari tabel fase, bukan faktor');
 if(a.flag==='ramai searah')why.push('posisi spekulan sudah ramai searah (risiko squeeze)');
 const all=[...gates.map(g=>'Data: '+g),...why];
 return all.length?{act:'HOLD',lean:dir,why:all}:{act:dir,lean:'',why:[]}}

function sigTag(x){if(!x)return '<span class="mute">–</span>';
 if(x.act==='BUY')return '<span class="tag p">BUY</span>';if(x.act==='SELL')return '<span class="tag n">SELL</span>';

 return `<section class="card"><h2>Sinyal fundamental</h2><p style="margin:0 0 6px;font-weight:600">${head}</p>

function spark(ser){if(ser.length<2)return '';const w=300,h=54,mn=Math.min(...ser),mx=Math.max(...ser),sp=mx-mn||1;

 return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Net per open interest"><line class="g" x1="0" x2="${w}" y1="${Y(q(.9))}" y2="${Y(q(.9))}"/><line class="g" x1="0" x2="${w}" y1="${Y(q(.1))}" y2="${Y(q(.1))}"/><polyline class="l" points="${pts}"/><circle class="d" cx="${X(ser.length-1)}" cy="${Y(ser[ser.length-1])}" r="3"/></svg>`}

draft.rel.date=state.asof;renderAll();setStatus('lokal');
(async()=>{try{const db=await window.claude?.use?.('db');if(!db)return;dbDoc=db.doc('state/main');const s=await dbDoc.get();
 if(s.exists){const j=JSON.parse(s.data().json);state=norm(j);if(j.example)state.example=true;try{localStorage.setItem('med-v1',JSON.stringify(state))}catch(e){}renderAll()}
 setStatus('db')}catch(e){setStatus('lokal')}})();

/* ---------- feed otomatis (GitHub Actions -> data/feed.json) ---------- */
async function applyFeed(){try{const r=await fetch('data/feed.json?'+Date.now(),{cache:'no-store'});if(!r.ok){FS.feed='gagal dimuat, HTTP '+r.status;drawStatus();return}const f=await r.json();if(!f||!f.generated){FS.feed='belum ada data, menunggu run workflow pertama';drawStatus();return}
 if(FS.gen.feed===f.generated){FS.feed='ok '+f.generated.slice(0,16).replace('T',' ')+' UTC';drawStatus();return}FS.gen.feed=f.generated;
 if(state.example){state=norm(defaults());state.example=false}
 for(const x of f.releases||[]){if(!IND_BY[x.ind]||x.act==null||!validDate(x.date))continue;
  const o=state.releases.find(q=>q.ind===x.ind&&q.date===x.date);
  if(!o)state.releases.push({id:mkid(),date:x.date,ind:x.ind,act:x.act,cons:x.cons,prev:null,note:x.src==='file'?'feed+k':'feed'});
  else if(o.note==='feed'||o.note==='feed+k'){o.act=x.act;if(x.cons!=null)o.cons=x.cons;if(x.src==='file')o.note='feed+k'}}
 if(f.actual)state.actual=f.actual;
 for(const k in f.shock||{})if(f.shock[k]!=null&&k in state.shock)state.shock[k]=f.shock[k];
 for(const k in f.liq||{})if(f.liq[k]!=null)state.liq[k]=f.liq[k];
 for(const k in f.cb||{})if(state.cb[k])for(const q of['rate','imp','infl'])if(f.cb[k][q]!=null)state.cb[k][q]=f.cb[k][q];
 for(const k in f.cot||{})if(state.cot[k])for(const x of f.cot[k]){state.cot[k].rows=state.cot[k].rows.filter(q=>q.d!==x.d);state.cot[k].rows.push({d:x.d,net:x.net,oi:x.oi})}
 state.asof=todayStr();persist();renderAll();
 FS.feed='ok '+f.generated.slice(0,16).replace('T',' ')+' UTC';drawStatus()}catch(e){FS.feed='error: '+(e&&e.message||e);drawStatus()}}

/* ---------- panel audit (data/audit.json) ---------- */
async function showAudit(){try{const r=await fetch('data/audit.json?'+Date.now(),{cache:'no-store'});if(!r.ok){FS.audit='gagal dimuat, HTTP '+r.status;drawStatus();return}const a=await r.json();if(!a||!a.generated){FS.audit='belum ada hasil, menunggu run workflow';drawStatus();return}
 const first=!META.audit;META.audit=a.counts||{};FS.audit='ok '+a.generated.slice(0,16).replace('T',' ')+' UTC';if(first&&ui.tab==='dash')renderMain();const c=a.counts||{},bad=(c.fail||0)>0,w=(c.warn||0)>0;const col=bad?'#b3261e':w?'var(--warn)':'#1e7a46';
 const ic={fail:'GAGAL',warn:'CEK',ok:'OK'};
 const rows=(a.checks||[]).filter(x=>x.level!=='ok').concat((a.checks||[]).filter(x=>x.level==='ok')).map(x=>`<div style="display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line,#8884)"><b style="min-width:46px;color:${x.level==='fail'?'#b3261e':x.level==='warn'?'#9a6700':'#1e7a46'}">${ic[x.level]}</b><span style="flex:1"><i>${esc(x.grp)}</i> ${esc(x.msg)}${x.link?` <a href="${esc(x.link)}" target="_blank" rel="noopener">sumber</a>`:''}</span></div>`).join('');
AUD_HTML=`<details style="border:1px solid ${col};border-radius:6px;padding:8px 12px;margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:${col}">Audit data: ${c.ok||0} OK · ${c.warn||0} cek · ${c.fail||0} gagal <span style="font-weight:400;opacity:.7">(${esc(a.generated.slice(0,16).replace('T',' '))} UTC)</span></summary><div style="font-size:.9em;margin-top:6px">${rows}</div></details>`;drawStatus()}catch(e){FS.audit='error: '+(e&&e.message||e);drawStatus()}}

/* ---------- beta hasil estimasi (data/betas.json) ---------- */
async function applyBetas(){try{const r=await fetch('data/betas.json?'+Date.now(),{cache:'no-store'});if(!r.ok){FS.beta='gagal dimuat, HTTP '+r.status;drawStatus();return}const j=await r.json();if(!j||!j.generated||!j.assets){FS.beta='belum dihitung (menunggu run mingguan)';drawStatus();return}
 for(const k in j.assets){const a=j.assets[k];if(a.use&&a.est&&a.est.length===7)META.est[k]=a.est}
 META.betaInfo=j;FS.beta='ok '+j.generated.slice(0,10);drawStatus();if(FS.gen.beta!==j.generated){FS.gen.beta=j.generated;if(ui.tab==='dash'||ui.tab==='model')renderMain()}}catch(e){FS.beta='error: '+(e&&e.message||e);drawStatus()}}

/* ---------- baris status sumber otomatis + muat ulang berkala ---------- */
function drawStatus(){const el=$('#audit');if(!el)return;const ok=v=>String(v).startsWith('ok');
 const it=(n,v)=>`<span style="white-space:nowrap"><b style="color:${ok(v)?'#1e7a46':'#9a6700'}">${ok(v)?'✓':'!'}</b> ${n}: ${esc(v)}</span>`;
 el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:.85em;margin-top:10px;opacity:.9">${it('feed',FS.feed)}${it('audit',FS.audit)}${it('beta',FS.beta)}<button class="btn ghost sm" data-act="reload">Muat ulang</button></div>${AUD_HTML}`}
function refreshAll(){applyFeed();showAudit();applyBetas()}
drawStatus();refreshAll();setInterval(refreshAll,600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll()});
</script>
</body></html>
