name: feed-dan-deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/series
          key: "series-${{ github.run_id }}"
          restore-keys: "series-"

      - name: Pipeline (data, audit, analysis, concept checks)
        run: python scripts/pipeline.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Save consensus history
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/consensus.csv data/betas.json
          if ! git diff --cached --quiet; then
            git commit -m "konsensus: update [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build
        env:
          VITE_MACRO_API_URL: ${{ vars.VITE_MACRO_API_URL }}

      - name: Copy pipeline output into the Pages artifact
        run: |
          mkdir -p dist/data
          cp -a data/. dist/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
